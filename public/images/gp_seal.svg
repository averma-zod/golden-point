<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#dfb758"/>
      <stop offset="70%" stop-color="#9a7726"/>
      <stop offset="100%" stop-color="#f5dc88"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Wing -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M 68 62 C 55 50 35 45 10 50 C 25 58 45 62 60 70 Z" />
    <path d="M 65 70 C 50 62 30 60 15 68 C 30 73 50 75 62 78 Z" />
    <path d="M 65 78 C 52 74 38 74 24 82 C 40 84 55 83 66 84 Z" />
  </g>

  <!-- Right Wing -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M 132 62 C 145 50 165 45 190 50 C 175 58 155 62 140 70 Z" />
    <path d="M 135 70 C 150 62 170 60 185 68 C 170 73 150 75 138 78 Z" />
    <path d="M 135 78 C 148 74 162 74 176 82 C 160 84 145 83 134 84 Z" />
  </g>

  <!-- 3 Stars -->
  <g fill="url(#goldGrad)" transform="translate(0, -6)">
    <!-- Center star -->
    <polygon points="100,24 102.5,31.5 110,31.5 104,36 106.5,43.5 100,39 93.5,43.5 96,36 90,31.5 97.5,31.5" />
    <!-- Left star -->
    <polygon points="83,31 85,36.5 91,36.5 86,40 88,46 83,42.5 78,46 80,40 75,36.5 81,36.5" transform="scale(0.85) translate(14, 5)" />
    <!-- Right star -->
    <polygon points="117,31 119,36.5 125,36.5 120,40 122,46 117,42.5 112,46 114,40 109,36.5 115,36.5" transform="scale(0.85) translate(21, 5)" />
  </g>

  <!-- Central Medallion Outer Ring -->
  <circle cx="100" cy="72" r="30" fill="#0d0b07" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />
  <circle cx="100" cy="72" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- GP Monogram -->
  <text x="100" y="80" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="22" fill="url(#goldGrad)" letter-spacing="1">GP</text>
</svg>
